<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Presidents of India | Master Dynamic 2.5D Motion Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Caveat:wght@700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-void: #040608;
      --card-bg: rgba(12, 16, 25, 0.94);
      --glow-line: #fffdf2;
      --glow-warm: rgba(255, 238, 170, 0.85);
      --accent-gold: #ffbe3b;
      --bar-glow: rgba(255, 190, 59, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-void);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #151b2a 0%, #07090f 55%, var(--bg-void) 100%);
    }

    /* Ambient Matrix Grid & Deep Cinematic Vignette */
    .ambient-grid {
      position: absolute;
      inset: -3500px;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.055) 1.5px, transparent 1.5px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 75px 75px, 75px 75px, 75px 75px;
      pointer-events: none;
    }
    .vignette-fader {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(4, 6, 8, 0.94) 100%);
      pointer-events: none;
      z-index: 2;
    }

    /* Top Right Minimalist Index Pill */
    .index-pill {
      position: absolute;
      top: 36px;
      right: 56px;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2.5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 253, 242, 0.28);
      backdrop-filter: blur(14px);
      padding: 10px 26px;
      border-radius: 30px;
      color: var(--glow-line);
      box-shadow: 0 0 22px rgba(255, 238, 170, 0.18);
      z-index: 50;
      pointer-events: none;
    }

    /* 3D Infinite Canvas World */
    .viewport {
      position: absolute;
      inset: 0;
      perspective: 1500px;
      z-index: 10;
    }
    #canvas-world {
      position: absolute;
      left: 960px;
      top: 540px;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Connecting Curved Line Overlay Between Nodes */
    #svg-connections {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }
    .connector-line {
      fill: none;
      stroke: var(--glow-line);
      stroke-width: 2.5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 10px var(--glow-warm));
    }

    /* Main Center Presidential Node Container */
    .pres-node {
      position: absolute;
      width: 480px;
      height: 700px;
      margin-left: -240px;
      margin-top: -350px;
      transform-style: preserve-3d;
      z-index: 10;
    }

    /* Center Card Shell */
    .card-core {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 0 45px 95px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 238, 170, 0.08);
      backdrop-filter: blur(28px);
      transform-style: preserve-3d;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* Progressive Handmade Border */
    .handmade-border-svg {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .progressive-border-path {
      fill: none;
      stroke: var(--glow-line);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px var(--glow-warm)) drop-shadow(0 0 24px rgba(255, 190, 59, 0.4));
    }

    /* Massive Year Behind Head */
    .year-behind-head {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%) translateZ(-20px);
      font-family: 'Cinzel', serif;
      font-size: 145px;
      font-weight: 900;
      color: rgba(255, 253, 242, 0.09);
      letter-spacing: -3px;
      text-shadow: 0 0 45px rgba(255, 238, 170, 0.28);
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
    }

    /* Background Landmark Cutout (Layer 2 at Z: 10px) */
    .bg-landmark-box {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateZ(10px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }
    .bg-landmark-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.85));
    }

    /* Foreground President Cutout (Layer 3 at Z: 85px for Heavy 2.5D Parallax) */
    .cutout-box {
      position: absolute;
      top: -55px;
      left: 50%;
      width: 410px;
      height: 510px;
      transform: translateX(-50%) translateZ(85px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 4;
      pointer-events: none;
      will-change: transform;
    }
    .cutout-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.95));
      -webkit-box-reflect: below 2px linear-gradient(transparent 75%, rgba(0, 0, 0, 0.28));
    }

    /* Bottom Card Details */
    .card-details {
      position: absolute;
      bottom: 24px;
      left: 28px;
      right: 28px;
      transform: translateZ(40px);
      z-index: 6;
    }
    .term-badge {
      display: inline-flex;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--accent-gold);
      background: rgba(255, 190, 59, 0.16);
      border: 1px solid rgba(255, 190, 59, 0.4);
      padding: 5px 15px;
      border-radius: 20px;
      margin-bottom: 6px;
    }
    .pres-name {
      font-family: 'Cinzel', serif;
      font-size: 27px;
      font-weight: 900;
      line-height: 1.2;
    }

    /* =========================================================================
       CANVAS FREESTANDING KINETIC GROUPS (TOP MARGIN + INDIVIDUAL SIZES)
       ========================================================================= */
    .canvas-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 25;
    }

    /* Micro-Element: SVG Icon Wrapper */
    .group-icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 16px rgba(255, 190, 59, 0.85));
    }
    .motion-svg-art {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .drawn-stroke {
      fill: none;
      stroke: var(--accent-gold);
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Punchy Kinetic Gradient Headlines */
    .group-headline {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.9));
    }
    .headline-gold {
      background: linear-gradient(135deg, #ffffff 0%, #ffbe3b 60%, #ff883b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 190, 59, 0.45));
    }
    .headline-cyan {
      background: linear-gradient(135deg, #ffffff 0%, #00f2fe 55%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.45));
    }
    .headline-crimson {
      background: linear-gradient(135deg, #ffffff 0%, #ff4b5a 50%, #ffbe3b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 75, 90, 0.45));
    }

    /* Handwritten Cursive Annotations */
    .group-sub {
      font-family: 'Caveat', cursive;
      font-size: 25px;
      color: var(--accent-gold);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 0 10px rgba(255, 190, 59, 0.5);
    }

    /* =========================================================================
       EXCLUSIVE MASSIVE IMPACT STAMP (3RD ELEMENT SLAM PHYSICS)
       ========================================================================= */
    .impact-stamp-card {
      position: absolute;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 35;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
      border-radius: 24px;
    }

    /* Bespoke Physical Metaphor Shapes for Stamps */
    .stamp-railway {
      background: #24160a;
      border: 3px dashed #ffbe3b;
      padding: 16px 28px;
      clip-path: polygon(0 0, 96% 0, 100% 15%, 96% 30%, 100% 45%, 96% 60%, 100% 75%, 96% 90%, 100% 100%, 0 100%);
    }
    .stamp-nobel {
      background: radial-gradient(circle at 30% 30%, #523f0d, #1a1403);
      border: 3.5px double #ffbe3b;
      padding: 18px 30px;
      box-shadow: 0 0 45px rgba(255, 190, 59, 0.5);
    }
    .stamp-coin {
      background: radial-gradient(circle, #2d183d, #14081c);
      border: 2.5px solid #c084fc;
      padding: 16px 28px;
    }
    .stamp-warrant {
      background: #280b10;
      border-right: 6px solid #ff3b47;
      border-top: 1.5px solid #ff3b47;
      padding: 16px 26px;
    }
    .stamp-tennis {
      background: #09261a;
      border: 2.5px solid #10b981;
      border-radius: 18px 18px 45px 45px;
      padding: 18px 28px;
    }
    .stamp-eco {
      background: #0f2b15;
      border: 2.5px solid #34d399;
      padding: 16px 26px;
    }
    .stamp-milestone {
      background: #2b200b;
      border: 3px solid #ffbe3b;
      border-radius: 35px 35px 12px 12px;
      padding: 18px 26px;
    }
    .stamp-treasury {
      background: #241e0e;
      border-top: 5px solid #ffbe3b;
      padding: 16px 26px;
    }
    .stamp-cambridge {
      background: #2b0b16;
      border: 2.5px solid #f43f5e;
      padding: 16px 26px;
    }
    .stamp-press {
      background: #0a1b2b;
      border: 2.5px solid #00f2fe;
      padding: 16px 26px;
    }
    .stamp-cheque {
      background: #261b0c;
      border-bottom: 5px solid #f59e0b;
      padding: 16px 26px;
    }
    .stamp-rosette {
      background: #081d36;
      border: 2.5px solid #38bdf8;
      border-radius: 35px;
      padding: 16px 28px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.4);
    }
    .stamp-diary {
      background: #260e0e;
      border-left: 6px solid #fb7185;
      padding: 16px 26px;
    }
    .stamp-deed {
      background: #261c10;
      border: 2.5px solid #fbbf24;
      padding: 16px 26px;
    }
    .stamp-lotus {
      background: radial-gradient(circle at top, #3b220b, #140b04);
      border: 2.5px solid #f59e0b;
      border-radius: 30px;
      padding: 18px 30px;
      box-shadow: 0 0 40px rgba(245, 158, 11, 0.45);
    }

    .stamp-micro-badge {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }
    .stamp-main-text {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    /* Full Animated Hand-Drawn Gradient Progress Bar */
    .progress-bar-container {
      position: absolute;
      bottom: 24px;
      left: 80px;
      right: 80px;
      height: 28px;
      display: flex;
      align-items: center;
      z-index: 60;
      pointer-events: none;
    }
    .handdrawn-progress-svg {
      width: 100%;
      height: 28px;
      overflow: visible;
    }
    .progress-track-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .progress-track-fill {
      fill: none;
      stroke: url(#progGradient);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px var(--bar-glow));
    }
  </style>
</head>

      {

        bgImg: "assets/images/15_droupadi_murmu_bg.png",
        bgMeta: { title: "New Parliament & Santhali Stone Plinth", bottom: "25px", w: "500px", h: "420px", opacity: 0.9 },
        // e1 (First in VO): Converted home to free school -> Placed LEFT (+20% Bigger)

          rot: -3.5,

          time: 3.2,
          svg: `<path d="M18 42l26-22 26 22v24H18z" class="drawn-stroke"/><path d="M32 66v-16h16v16" class="drawn-stroke"/><circle cx="44" cy="30" r="5" class="drawn-stroke"/>`
        },
        // e2 (Second in VO): 1st tribal president -> Placed RIGHT (-20% Compact, at ~9.2s)
        e2: {
          side: "right",
          pos: "right: -420px; top: 80px; width: 340px;",
          rot: 3.0,
          theme: "headline-cyan",
          fontSize: "32px",
          iconSize: "68px",
          title: "1ST TRIBAL PRESIDENT",
          sub: "Youngest Head of Indian Republic",
          time: 9.2,
          svg: `<path d="M34 11c-10 10-14 23-5 35 3 5 14 5 18 0 9-12 5-25-13-35z" class="drawn-stroke"/><path d="M34 21v26" class="drawn-stroke"/>`
        },
        stamp: {
          shapeClass: "stamp-lotus",
          pos: "left: -440px; bottom: 25px;",
          badge: "👁️ VISION BANK DONOR",
          main: "PLEDGED EYES & SLS TRUST",
          time: 17.0
        }

    const world = document.getElementById('canvas-world');
    const svgConnections = document.getElementById('svg-connections');

    // Organic Wobbly Rectangle Path for 480x700 card (perimeter ~ 2460px)
    const handmadeCardD = "M 32 8 C 145 4, 355 12, 470 7 C 492 8, 502 24, 500 48 C 504 190, 498 540, 501 688 C 500 710, 488 724, 466 723 C 340 726, 145 721, 34 724 C 16 723, 6 708, 8 688 C 5 550, 10 190, 7 48 C 6 26, 16 8, 32 8 Z";

    // 1. Build All 15 President Nodes with Asymmetric Kinetic Elements
    PRESIDENTS.forEach((p, i) => {
      const node = document.createElement('div');
      node.className = 'pres-node';
      node.id = `node-${i}`;
      node.style.left = `${p.x}px`;
      node.style.top = `${p.y}px`;

      node.innerHTML = `
        <!-- Main Center Subject Card -->
        <div class="card-core" id="core-${i}">
          <svg class="handmade-border-svg" viewBox="0 0 508 732">
            <path id="border-path-${i}" class="progressive-border-path" d="${handmadeCardD}" stroke-dasharray="2460" stroke-dashoffset="2460" />
          </svg>
          <div class="year-behind-head" data-layout-allow-overlap="true" data-layout-allow-occlusion="true">${p.year}</div>

          <!-- Layer 2: Background Landmark Cutout (translateZ: 10px) -->
          <div class="bg-landmark-box" id="bg-landmark-${i}" style="bottom: ${p.bgMeta.bottom}; width: ${p.bgMeta.w}; height: ${p.bgMeta.h}; opacity: ${p.bgMeta.opacity};">
            <img class="bg-landmark-img" src="${p.bgImg}" onerror="this.style.opacity='0'" alt="${p.bgMeta.title}">
          </div>

          <!-- Layer 3: Foreground President Cutout (translateZ: 85px for Heavy 2.5D Parallax) -->
          <div class="cutout-box" id="cutout-${i}">
            <img class="cutout-img" src="${p.img}" onerror="this.src='${p.fallbackImg}'" alt="${p.name}">
          </div>

          <!-- Layer 4: Card Bottom Details -->
          <div class="card-details" id="card-details-${i}">
            <span class="term-badge">${p.term}</span>
            <h2 class="pres-name">${p.name}</h2>
          </div>
        </div>

        <!-- FREESTANDING KINETIC ELEMENT 1 (Voiceover Event 1) -->
        <div class="canvas-group" id="elem-1-${i}" style="${p.e1.pos} transform: rotate(${p.e1.rot}deg);">
          <div class="group-icon-wrap" id="icon-1-${i}" style="width: ${p.e1.iconSize}; height: ${p.e1.iconSize};">
            <svg class="motion-svg-art" viewBox="0 0 88 88">${p.e1.svg}</svg>
          </div>
          <div class="group-headline ${p.e1.theme}" id="head-1-${i}" style="font-size: ${p.e1.fontSize};">${p.e1.title}</div>
          <div class="group-sub" id="sub-1-${i}">✦ ${p.e1.sub}</div>
        </div>

        <!-- FREESTANDING KINETIC ELEMENT 2 (Voiceover Event 2 - Just before 10s mark) -->
        <div class="canvas-group" id="elem-2-${i}" style="${p.e2.pos} transform: rotate(${p.e2.rot}deg);">
          <div class="group-icon-wrap" id="icon-2-${i}" style="width: ${p.e2.iconSize}; height: ${p.e2.iconSize};">
            <svg class="motion-svg-art" viewBox="0 0 88 88">${p.e2.svg}</svg>
          </div>
          <div class="group-headline ${p.e2.theme}" id="head-2-${i}" style="font-size: ${p.e2.fontSize};">${p.e2.title}</div>
          <div class="group-sub" id="sub-2-${i}">✦ ${p.e2.sub}</div>
        </div>

        <!-- 3RD ELEMENT: BESPOKE BIG IMPACT STAMP (Last 3.5s) -->
        <div class="impact-stamp-card ${p.stamp.shapeClass}" id="stamp-${i}" style="${p.stamp.pos}">
          <div class="stamp-micro-badge">${p.stamp.badge}</div>
          <div class="stamp-main-text">${p.stamp.main}</div>
        </div>
      `;
      world.appendChild(node);

      // Connecting Curved Line to next node across 2D plane
      if (i > 0) {
        const prev = PRESIDENTS[i - 1];
        const midX = (prev.x + p.x) / 2;
        const midY = (prev.y + p.y) / 2 + (i % 2 === 0 ? 180 : -180);
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("class", "connector-line");
        arrow.setAttribute("id", `arrow-${i}`);
        arrow.setAttribute("d", `M ${prev.x + 240} ${prev.y} Q ${midX} ${midY} ${p.x - 240} ${p.y}`);
        arrow.setAttribute("stroke-dasharray", "1800");
        arrow.setAttribute("stroke-dashoffset", "1800");
        svgConnections.appendChild(arrow);
      }
    });

    // 2. HyperFrames Deterministic GSAP Timeline Setup
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;

    // Full Animated Hand-Drawn Gradient Progress Bar from 0 to 268s
    tl.fromTo("#progressFillPath", 
      { strokeDashoffset: 1760 }, 
      { strokeDashoffset: 0, duration: 268, ease: "none" }, 
      0
    );

    // Dynamic gradient color shift across the 268 seconds
    const gradientStops = [
      { t: 0, s1: "#ff3b47", s2: "#ffbe3b", s3: "#00f2fe", s4: "#4facfe" },
      { t: 56, s1: "#ffbe3b", s2: "#00f2fe", s3: "#4facfe", s4: "#7000ff" },
      { t: 110, s1: "#00f2fe", s2: "#4facfe", s3: "#7000ff", s4: "#ff007f" },
      { t: 178, s1: "#4facfe", s2: "#ff3b47", s3: "#ffbe3b", s4: "#00f2fe" },
      { t: 230, s1: "#ffbe3b", s2: "#ff3b47", s3: "#7000ff", s4: "#fffdf2" }
    ];

    gradientStops.forEach(stop => {
      tl.to("#stop1", { stopColor: stop.s1, duration: 10, ease: "sine.inOut" }, stop.t);
      tl.to("#stop2", { stopColor: stop.s2, duration: 10, ease: "sine.inOut" }, stop.t);
      tl.to("#stop3", { stopColor: stop.s3, duration: 10, ease: "sine.inOut" }, stop.t);
      tl.to("#stop4", { stopColor: stop.s4, duration: 10, ease: "sine.inOut" }, stop.t);
    });

    let timeOffset = 0;

    PRESIDENTS.forEach((p, i) => {
      const node = `#node-${i}`;
      const core = `#core-${i}`;
      const border = `#border-path-${i}`;
      const bgLandmark = `#bg-landmark-${i}`;
      const cutout = `#cutout-${i}`;
      const details = `#card-details-${i}`;

      const icon1 = `#icon-1-${i}`;
      const head1 = `#head-1-${i}`;
      const sub1 = `#sub-1-${i}`;
      const svgStroke1 = `#icon-1-${i} .drawn-stroke`;

      const icon2 = `#icon-2-${i}`;
      const head2 = `#head-2-${i}`;
      const sub2 = `#sub-2-${i}`;
      const svgStroke2 = `#icon-2-${i} .drawn-stroke`;

      const stamp = `#stamp-${i}`;

      const t = timeOffset;
      const dur = p.duration;

      if (i === 0) {
        // Initial Scene Focus (Center Node Lands)
        tl.set("#canvas-world", { x: -p.x, y: -p.y }, 0);
        tl.set(node, { scale: 1, opacity: 1, z: 45 }, 0);
        tl.set("#counterIndicator", { textContent: "01 / 15" }, 0);

        // Year reveals behind head
        tl.fromTo(`${node} .year-behind-head`, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 0.2);

        // Background Landmark Cutout appears
        tl.fromTo(bgLandmark, { scale: 0.92, opacity: 0, z: -10 }, { scale: 1, opacity: p.bgMeta.opacity, z: 10, duration: 0.7, ease: "power2.out" }, 0.4);

        // Foreground President Cutout drops with realistic bounce
        tl.fromTo(cutout, { y: 45, scale: 0.92, opacity: 0, z: 40 }, { y: 0, scale: 1, opacity: 1, z: 85, duration: 0.75, ease: "back.out(1.4)" }, 0.7);

        // Card Bottom Details illuminate
        tl.fromTo(details, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, 1.0);

        // Progressive Border: Runs through the ENTIRE duration of this audio
        tl.fromTo(border, { strokeDashoffset: 2460 }, { strokeDashoffset: 0, duration: dur, ease: "linear" }, 0);

        // ==============================================================
        // ELEMENT 1 REVEAL SEQUENCE (Voiceover Event 1 at ~3.0s)
        // Icon -> Big Text -> Small Text
        // ==============================================================
        const e1Start = p.e1.time;
        tl.fromTo(icon1, 
          { scale: 0, opacity: 0, rotate: -20 }, 
          { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(1.8)" }, 
          e1Start
        );
        tl.fromTo(svgStroke1, 
          { strokeDasharray: 300, strokeDashoffset: 300 }, 
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 
          e1Start + 0.1
        );
        tl.fromTo(head1, 
          { opacity: 0, y: 24, filter: "blur(6px)" }, 
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 
          e1Start + 0.35
        );
        tl.fromTo(sub1, 
          { opacity: 0, x: -14 }, 
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 
          e1Start + 0.65
        );

        // ==============================================================
        // ELEMENT 2 REVEAL SEQUENCE (Voiceover Event 2 at ~9.0s mark)
        // Icon -> Big Text -> Small Text
        // ==============================================================
        const e2Start = p.e2.time;
        tl.fromTo(icon2, 
          { scale: 0, opacity: 0, rotate: 20 }, 
          { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(1.8)" }, 
          e2Start
        );
        tl.fromTo(svgStroke2, 
          { strokeDasharray: 300, strokeDashoffset: 300 }, 
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 
          e2Start + 0.1
        );
        tl.fromTo(head2, 
          { opacity: 0, y: 24, filter: "blur(6px)" }, 
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 
          e2Start + 0.35
        );
        tl.fromTo(sub2, 
          { opacity: 0, x: 14 }, 
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 
          e2Start + 0.65
        );

        // ==============================================================
        // 3RD ELEMENT: MASSIVE IMPACT STAMP SLAM (Last 3.5s)
        // Heavy Ink Slam Overshoot
        // ==============================================================
        const stampStart = p.stamp.time;
        tl.fromTo(stamp, 
          { scale: 2.2, opacity: 0, rotate: -12 }, 
          { scale: 1, opacity: 1, rotate: -3, duration: 0.55, ease: "back.out(2.5)" }, 
          stampStart

      } else {
        const transStart = Math.max(0, t - 0.7);
        const prevNode = `#node-${i - 1}`;
        const arrow = `#arrow-${i}`;
        const prevArrow = `#arrow-${i - 1}`;

        // Previous node gently blurs and recedes
        tl.to(prevNode, { scale: 0.75, opacity: 0.08, filter: "blur(14px)", duration: 0.9, ease: "power2.inOut" }, transStart);

        // Camera glides along infinite 2D canvas exactly on the beat
        tl.to("#canvas-world", { x: -p.x, y: -p.y, duration: 1.1, ease: "power3.inOut" }, transStart);

        // Connector line draws bright
        tl.fromTo(arrow, { strokeDashoffset: 1800, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, transStart + 0.1);

        // Current node enters focus from blur
        tl.fromTo(node, { scale: 0.85, opacity: 0.12, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", z: 45, duration: 0.9, ease: "power2.out" }, transStart + 0.3);

        tl.to(arrow, { opacity: 0.12, duration: 0.8, ease: "power2.inOut" }, t + 0.8);
        if (i > 1) {
          tl.to(prevArrow, { opacity: 0.06, duration: 0.5 }, transStart);
        }

        // Progressive Border
        tl.fromTo(border, { strokeDashoffset: 2460 }, { strokeDashoffset: 0, duration: dur, ease: "linear" }, t);

        // Year behind head reveals
        tl.fromTo(`${node} .year-behind-head`, { y: -25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, t + 0.2);

        // Background Landmark Cutout appears
        tl.fromTo(bgLandmark, { scale: 0.92, opacity: 0, z: -10 }, { scale: 1, opacity: p.bgMeta.opacity, z: 10, duration: 0.7, ease: "power2.out" }, t + 0.35);

        // Foreground President Cutout drops with weight
        tl.fromTo(cutout, { y: 40, scale: 0.92, opacity: 0, z: 40 }, { y: 0, scale: 1, opacity: 1, z: 85, duration: 0.75, ease: "back.out(1.4)" }, t + 0.65);

        // Card Bottom Details illuminate
        tl.fromTo(details, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, t + 0.95);

        // Counter update
        tl.set("#counterIndicator", { textContent: `${String(i + 1).padStart(2, '0')} / 15` }, transStart + 0.6);

        // ==============================================================
        // ELEMENT 1 REVEAL (Voiceover Event 1 at ~3.0s)
        // ==============================================================
        const e1Start = t + p.e1.time;
        tl.fromTo(icon1, 
          { scale: 0, opacity: 0, rotate: -20 }, 
          { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(1.8)" }, 
          e1Start
        );
        tl.fromTo(svgStroke1, 
          { strokeDasharray: 300, strokeDashoffset: 300 }, 
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 
          e1Start + 0.1
        );
        tl.fromTo(head1, 
          { opacity: 0, y: 24, filter: "blur(6px)" }, 
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 
          e1Start + 0.35
        );
        tl.fromTo(sub1, 
          { opacity: 0, x: -14 }, 
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 
          e1Start + 0.65
        );

        // ==============================================================
        // ELEMENT 2 REVEAL (Voiceover Event 2 at ~9.0s mark)
        // ==============================================================
        const e2Start = t + p.e2.time;
        tl.fromTo(icon2, 
          { scale: 0, opacity: 0, rotate: 20 }, 
          { scale: 1, opacity: 1, rotate: 0, duration: 0.5, ease: "back.out(1.8)" }, 
          e2Start
        );
        tl.fromTo(svgStroke2, 
          { strokeDasharray: 300, strokeDashoffset: 300 }, 
          { strokeDashoffset: 0, duration: 0.85, ease: "power2.out" }, 
          e2Start + 0.1
        );
        tl.fromTo(head2, 
          { opacity: 0, y: 24, filter: "blur(6px)" }, 
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 
          e2Start + 0.35
        );
        tl.fromTo(sub2, 
          { opacity: 0, x: 14 }, 
          { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" }, 
          e2Start + 0.65
        );

        // ==============================================================
        // 3RD ELEMENT: MASSIVE IMPACT STAMP SLAM (Last 3.5s)
        // ==============================================================
        const stampStart = t + p.stamp.time;
        tl.fromTo(stamp, 
          { scale: 2.2, opacity: 0, rotate: -12 }, 
          { scale: 1, opacity: 1, rotate: -3, duration: 0.55, ease: "back.out(2.5)" }, 
          stampStart
        );
      }

      // ⭐️ DRAMATIC 2.5D OPTICAL PARALLAX BETWEEN CENTER PNGs
      // Background landmark drifts slowly in one direction:
      tl.to(bgLandmark, { x: -20, y: 12, scale: 1.05, duration: dur - 1.2, ease: "sine.inOut" }, t + 0.8);
      // Foreground president cutout drifts faster in opposite direction:
      tl.to(cutout, { x: 24, y: -16, duration: dur - 1.2, ease: "sine.inOut" }, t + 0.8);

      timeOffset += dur;
    });
