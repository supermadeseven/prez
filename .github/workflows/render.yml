name: Render HyperFrames Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      quality:
        description: 'Render Quality (draft, standard, high)'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - high
          - draft

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HYPERFRAMES_NO_UPDATE_CHECK: 1
  CI: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup FFmpeg via GitHub CDN (3 Seconds, Zero APT)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "Downloading static FFmpeg from GitHub CDN..."
            curl -fsSL -o /tmp/ffmpeg.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            sudo tar -xJf /tmp/ffmpeg.tar.xz --strip-components=2 -C /usr/local/bin --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            rm -f /tmp/ffmpeg.tar.xz
          fi
          ffmpeg -version | head -n 1

      - name: Locate Project Folder & Fix Dependencies
        id: locate
        run: |
          if [ -f "hyperframes.json" ] || [ -f "index.html" ]; then
            PROJ_DIR="."
          elif [ -f "2/hyperframes.json" ] || [ -f "2/index.html" ]; then
            PROJ_DIR="2"
          else
            FOUND=$(find . -maxdepth 3 -name "hyperframes.json" | head -n 1)
            PROJ_DIR=$(dirname "${FOUND:-.}")
          fi
          echo "Detected project directory: $PROJ_DIR"
          echo "dir=$PROJ_DIR" >> $GITHUB_OUTPUT

          cd "$PROJ_DIR"
          rm -f package-lock.json npm-shrinkwrap.json

          if [ -f "package.json" ]; then
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
              for (const section of ["dependencies", "devDependencies", "overrides", "resolutions"]) {
                if (pkg[section] && pkg[section]["puppeteer-core"] && pkg[section]["puppeteer-core"].includes("25.16.0")) {
                  pkg[section]["puppeteer-core"] = "^25.15.0";
                }
                if (pkg[section] && pkg[section]["puppeteer"] && pkg[section]["puppeteer"].includes("25.16.0")) {
                  pkg[section]["puppeteer"] = "^25.14.0";
                }
              }
              pkg.dependencies = pkg.dependencies || {};
              if (!pkg.dependencies.hyperframes && !(pkg.devDependencies && pkg.devDependencies.hyperframes)) {
                pkg.dependencies.hyperframes = "latest";
              }
              fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
            '
          fi

      - name: Install Project Dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save hyperframes@latest

      - name: Ensure Headless Browser for HyperFrames
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          npx hyperframes browser ensure || npx puppeteer browsers install chrome-headless-shell@stable

      - name: Run HyperFrames Lint
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          npx hyperframes lint || true

      - name: Render HyperFrames Composition to MP4
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          mkdir -p renders
          QUALITY="${{ github.event.inputs.quality || 'standard' }}"
          npx hyperframes render \
            --quality "$QUALITY" \
            --fps 30 \
            --output renders/presidents_of_india.mp4

      - name: Upload Final Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presidents-of-india-video
          path: ${{ steps.locate.outputs.dir }}/renders/*.mp4
          if-no-files-found: error
          retention-days: 14
