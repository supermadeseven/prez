<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Presidents of India | Master 2.5D Freestanding Narrative Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Caveat:wght@700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg-void: #030508;
      --card-bg: rgba(10, 14, 22, 0.93);
      --glow-line: #fffdf2;
      --glow-warm: rgba(255, 238, 170, 0.85);
      --accent-gold: #ffbe3b;
      --accent-crimson: #ff3b47;
      --accent-cyan: #00f2fe;
      --bar-glow: rgba(255, 190, 59, 0.65);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-void);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      width: 1920px;
      height: 1080px;
    }
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #04060a;
    }

    /* =========================================================================
       ATMOSPHERIC BURNING FLARES, VOLUMETRIC HEAT & EMBER ENGINE
       ========================================================================= */
    #mood-backdrop {
      position: absolute;
      inset: -150px;
      background: radial-gradient(circle at 50% 50%, rgba(35, 24, 15, 0.8) 0%, rgba(7, 10, 18, 0.94) 58%, #020305 100%);
      pointer-events: none;
      z-index: 0;
      will-change: background;
    }
    .ambient-grid {
      position: absolute;
      inset: -3500px;
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.055) 1.5px, transparent 1.5px),
        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 75px 75px, 75px 75px, 75px 75px;
      pointer-events: none;
      z-index: 1;
    }

    /* Burning Flares & Glowing Embers SVG Layer */
    #burning-flares-svg {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      overflow: visible;
    }
    .burning-flare-orb {
      transform-origin: center center;
      will-change: transform, opacity;
    }
    #heat-flare-burst {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 55%, rgba(255, 120, 35, 0.38) 0%, rgba(255, 50, 40, 0.14) 45%, transparent 75%);
      opacity: 0.25;
      pointer-events: none;
      z-index: 3;
      mix-blend-mode: screen;
    }
    .vignette-fader {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(2, 4, 7, 0.94) 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* Top Right Minimalist Index Pill */
    .index-pill {
      position: absolute;
      top: 36px;
      right: 56px;
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2.5px;
      background: rgba(12, 18, 28, 0.78);
      border: 1px solid rgba(255, 253, 242, 0.32);
      backdrop-filter: blur(16px);
      padding: 10px 28px;
      border-radius: 30px;
      color: var(--glow-line);
      box-shadow: 0 0 28px rgba(255, 238, 170, 0.22);
      z-index: 50;
      pointer-events: none;
    }

    /* 3D Infinite Canvas World */
    .viewport {
      position: absolute;
      inset: 0;
      perspective: 1500px;
      z-index: 10;
    }
    #canvas-world {
      position: absolute;
      left: 960px;
      top: 540px;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* Connecting Curved Line Overlay Between Nodes */
    #svg-connections {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      overflow: visible;
      pointer-events: none;
      z-index: 5;
    }
    .connector-line {
      fill: none;
      stroke: var(--glow-line);
      stroke-width: 2.8;
      stroke-linecap: round;
      filter: drop-shadow(0 0 12px var(--glow-warm));
    }

    /* Main Center Presidential Node Container */
    .pres-node {
      position: absolute;
      width: 470px;
      height: 700px;
      margin-left: -235px;
      margin-top: -350px;
      transform-style: preserve-3d;
      z-index: 10;
    }

    /* Center Card Shell (ONLY the President Portrait stays in a Card) */
    .card-core {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--card-bg);
      border-radius: 32px;
      box-shadow: 0 45px 95px rgba(0, 0, 0, 0.92), 0 0 55px rgba(255, 238, 170, 0.1);
      backdrop-filter: blur(28px);
      transform-style: preserve-3d;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Progressive Handmade Border */
    .handmade-border-svg {
      position: absolute;
      inset: -12px;
      width: calc(100% + 24px);
      height: calc(100% + 24px);
      overflow: visible;
      pointer-events: none;
      z-index: 3;
    }
    .progressive-border-path {
      fill: none;
      stroke: var(--glow-line);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px var(--glow-warm)) drop-shadow(0 0 24px rgba(255, 190, 59, 0.45));
    }

    /* Massive Year Behind Head */
    .year-behind-head {
      position: absolute;
      top: -38px;
      left: 50%;
      transform: translateX(-50%) translateZ(-20px);
      font-family: 'Cinzel', serif;
      font-size: 142px;
      font-weight: 900;
      color: rgba(255, 253, 242, 0.095);
      letter-spacing: -3px;
      text-shadow: 0 0 45px rgba(255, 238, 170, 0.3);
      pointer-events: none;
      z-index: 1;
      white-space: nowrap;
    }

    /* Background Landmark Cutout (Layer 2 at Z: 10px) */
    .bg-landmark-box {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateZ(10px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
      pointer-events: none;
      will-change: transform;
    }
    .bg-landmark-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 18px 32px rgba(0, 0, 0, 0.85));
    }

    /* Foreground President Cutout (Layer 3 at Z: 85px for Heavy 2.5D Parallax) */
    .cutout-box {
      position: absolute;
      top: -55px;
      left: 50%;
      width: 410px;
      height: 510px;
      transform: translateX(-50%) translateZ(85px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 4;
      pointer-events: none;
      will-change: transform;
    }
    .cutout-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.95));
      -webkit-box-reflect: below 2px linear-gradient(transparent 75%, rgba(0, 0, 0, 0.28));
    }

    /* Bottom Card Details */
    .card-details {
      position: absolute;
      bottom: 22px;
      left: 26px;
      right: 26px;
      transform: translateZ(45px);
      z-index: 6;
      background: linear-gradient(to top, rgba(4, 6, 12, 0.92) 0%, rgba(4, 6, 12, 0.45) 75%, transparent 100%);
      padding-top: 12px;
      border-radius: 0 0 22px 22px;
    }
    .term-badge {
      display: inline-flex;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--accent-gold);
      background: rgba(255, 190, 59, 0.16);
      border: 1px solid rgba(255, 190, 59, 0.45);
      padding: 5px 15px;
      border-radius: 20px;
      margin-bottom: 6px;
    }
    .pres-name {
      font-family: 'Cinzel', serif;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95);
    }

    /* =========================================================================
       100% FREESTANDING CANVAS NARRATIVE SVGs & TYPOGRAPHY (NO CARDS/BOXES!)
       ========================================================================= */
    .canvas-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 25;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .group-icon-wrap {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent !important;
      border: none !important;
      overflow: visible;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, 0.85));
    }
    .motion-svg-art {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Vector Stroke Styles */
    .svg-part {
      fill: none;
      stroke: var(--accent-gold);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 10px rgba(255, 190, 59, 0.55));
    }
    .svg-fill-gold {
      fill: rgba(255, 190, 59, 0.15);
      stroke: var(--accent-gold);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .svg-crimson {
      fill: rgba(255, 59, 71, 0.18);
      stroke: #ff3b47;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px rgba(255, 59, 71, 0.75));
    }
    .svg-cyan {
      fill: rgba(0, 242, 254, 0.14);
      stroke: #00f2fe;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 0 12px rgba(0, 242, 254, 0.7));
    }

    /* Respective Live Action Animations on Canvas */
    @keyframes flameDance {
      0%, 100% { transform: scaleY(1) scaleX(1) skewX(0deg); opacity: 0.95; }
      33% { transform: scaleY(1.12) scaleX(0.92) skewX(-4deg); opacity: 1; }
      66% { transform: scaleY(0.93) scaleX(1.06) skewX(4deg); opacity: 0.88; }
    }
    @keyframes emberFloat {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-48px) scale(0.15); opacity: 0; }
    }
    @keyframes wheelSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseShock {
      0%, 100% { transform: scale(0.95); opacity: 0.45; }
      50% { transform: scale(1.08); opacity: 0.95; }
    }
    @keyframes floatBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes gavelStrike {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-22deg); }
      60% { transform: rotate(8deg); }
    }
    .act-flame-1 { transform-origin: center bottom; animation: flameDance 1.2s infinite ease-in-out; }
    .act-flame-2 { transform-origin: center bottom; animation: flameDance 0.85s infinite ease-in-out reverse; }
    .act-ember-1 { animation: emberFloat 1.6s infinite linear; }
    .act-ember-2 { animation: emberFloat 2.1s infinite linear 0.5s; }
    .act-ember-3 { animation: emberFloat 1.4s infinite linear 0.9s; }
    .act-spin { transform-box: fill-box; transform-origin: center; animation: wheelSpin 6s infinite linear; }
    .act-pulse { transform-box: fill-box; transform-origin: center; animation: pulseShock 2s infinite ease-in-out; }
    .act-float { animation: floatBob 2.4s infinite ease-in-out; }
    .act-gavel { transform-box: fill-box; transform-origin: right bottom; animation: gavelStrike 1.8s infinite ease-in-out; }

    /* Freestanding Kinetic Headlines */
    .group-headline {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      line-height: 1.04;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.95));
    }
    .headline-gold {
      background: linear-gradient(135deg, #ffffff 0%, #ffdf85 45%, #ff9d1b 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .headline-cyan {
      background: linear-gradient(135deg, #ffffff 0%, #7bf8ff 45%, #00a8ff 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .headline-crimson {
      background: linear-gradient(135deg, #ffffff 0%, #ff858d 40%, #ff2a3c 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .group-sub {
      font-family: 'Caveat', cursive;
      font-size: 26px;
      color: #ffd479;
      font-weight: 700;
      letter-spacing: 0.4px;
      line-height: 1.15;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.95), 0 0 12px rgba(255, 190, 59, 0.45);
    }

    /* =========================================================================
       3RD ELEMENT: BESPOKE IMPACT STAMP SLAM
       ========================================================================= */
    .impact-stamp-card {
      position: absolute;
      pointer-events: none;
      transform-style: preserve-3d;
      z-index: 35;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 14px;
      text-align: left;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 190, 59, 0.25);
      border-radius: 18px;
      padding: 14px 22px;
      background: rgba(20, 14, 8, 0.92);
      border: 2.5px solid var(--accent-gold);
      backdrop-filter: blur(14px);
    }
    .stamp-emblem-svg {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 10px rgba(255, 190, 59, 0.65));
    }
    .stamp-micro-badge {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 3px;
    }
    .stamp-main-text {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      color: #ffffff;
    }

    /* Full Animated Hand-Drawn Gradient Progress Bar */
    .progress-bar-container {
      position: absolute;
      bottom: 24px;
      left: 80px;
      right: 80px;
      height: 28px;
      display: flex;
      align-items: center;
      z-index: 60;
      pointer-events: none;
    }
    .handdrawn-progress-svg {
      width: 100%;
      height: 28px;
      overflow: visible;
    }
    .progress-track-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 4;
      stroke-linecap: round;
    }
    .progress-track-fill {
      fill: none;
      stroke: url(#progGradient);
      stroke-width: 5;
      stroke-linecap: round;
      filter: drop-shadow(0 0 12px var(--bar-glow));
    }
  </style>
</head>
<body>
  <!-- HyperFrames Root Composition: 268s Duration Total -->
  <div data-hf-id="hf-wvci" id="root" data-composition-id="main" data-start="0" data-duration="268" data-width="1920" data-height="1080">
    <div id="mood-backdrop"></div>
    <div data-hf-id="hf-dlix" class="ambient-grid"></div>

    <!-- Atmospheric Burning Flares & Rising Embers Layer (NO Thunder Lines) -->
    <svg id="burning-flares-svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
      <defs>
        <radialGradient id="flareGold" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fffdf2" stop-opacity="0.9"/>
          <stop offset="30%" stop-color="#ffbe3b" stop-opacity="0.55"/>
          <stop offset="65%" stop-color="#ff4b2b" stop-opacity="0.2"/>

        </radialGradient>
        <radialGradient id="flareCrimson" cx="50%" cy="50%" r="50%">

          <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>

          <linearGradient data-hf-id="hf-ppwm" id="progGradient" x1="0%" y1="0%" x2="100%" y2="0%">

            <stop data-hf-id="hf-y6ma" id="stop2" offset="30%" stop-color="#ffbe3b" />

        <path data-hf-id="hf-pt71" id="progressFillPath" class="progress-track-fill" d="M 10 14 C 320 11, 740 17, 1100 13 C 1420 15, 1680 12, 1750 14" stroke-dasharray="1760" stroke-dashoffset="1760" />
      </svg>
    </div>

    <!-- 15 Timed Audio Tracks (Exact Durations: 268s Total) -->
    <audio data-hf-id="hf-vxkc" preload="auto" src="assets/audio/01_rajendra_prasad.mp3" data-start="0" data-duration="19" data-track-index="0"></audio>
    <audio data-hf-id="hf-2g6w" preload="auto" src="assets/audio/02_s_radhakrishnan.mp3" data-start="19" data-duration="17" data-track-index="0"></audio>

  <script>
    // Generate 36 Glowing Burning Embers in the Background
    const embersLayer = document.getElementById('ambient-embers-layer');
    for (let e = 0; e < 36; e++) {
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", (e * 57) % 1920);
      c.setAttribute("cy", 180 + ((e * 89) % 880));
      c.setAttribute("r", 2.5 + (e % 4) * 1.8);
      c.setAttribute("fill", "url(#emberDot)");
      c.setAttribute("class", "ambient-ember");
      c.style.opacity = (0.25 + (e % 5) * 0.14).toFixed(2);
      embersLayer.appendChild(c);
    }

          <div class="group-headline ${p.e1.theme}" id="head-1-${i}" style="font-size: ${p.e1.fontSize};">${p.e1.title}</div>
          <div class="group-sub" id="sub-1-${i}">✦ ${p.e1.sub}</div>
        </div>

        <!-- FREESTANDING CANVAS ELEMENT 2 (No Card Box) -->
        <div class="canvas-group" id="elem-2-${i}" style="${p.e2.pos} transform: rotate(${p.e2.rot}deg);">
          <div class="group-icon-wrap" id="icon-2-${i}" style="height: ${p.e2.svgH};">
            <svg class="motion-svg-art" viewBox="0 0 280 175" preserveAspectRatio="xMidYMid meet">${p.e2.svg}</svg>
          </div>
          <div class="group-headline ${p.e2.theme}" id="head-2-${i}" style="font-size: ${p.e2.fontSize};">${p.e2.title}</div>
          <div class="group-sub" id="sub-2-${i}">✦ ${p.e2.sub}</div>
        </div>

        <!-- 3RD ELEMENT: STAMP -->
        <div class="impact-stamp-card" id="stamp-${i}" style="${p.stamp.pos}">
          <svg class="stamp-emblem-svg" viewBox="0 0 58 58">${p.stamp.svg}</svg>
          <div>
            <div class="stamp-micro-badge">${p.stamp.badge}</div>
            <div class="stamp-main-text">${p.stamp.main}</div>
          </div>
        </div>
      `;
      world.appendChild(node);

      if (i > 0) {
        const prev = PRESIDENTS[i - 1];
        const midX = (prev.x + p.x) / 2;
        const midY = (prev.y + p.y) / 2 + (i % 2 === 0 ? 180 : -180);
        const arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
        arrow.setAttribute("class", "connector-line");
        arrow.setAttribute("id", `arrow-${i}`);
        arrow.setAttribute("d", `M ${prev.x + 235} ${prev.y} Q ${midX} ${midY} ${p.x - 235} ${p.y}`);
        arrow.setAttribute("stroke-dasharray", "1800");
        arrow.setAttribute("stroke-dashoffset", "1800");
        svgConnections.appendChild(arrow);
      }
    });

    // Master GSAP Timeline
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;

    // Helper: Trigger Warm Burning Flare Surge in Background (Replaces Lightning)
    function scheduleBurningFlare(timeline, flareTime) {
      timeline.fromTo("#heat-flare-burst",
        { opacity: 0.2, scale: 0.92 },
        { opacity: 0.85, scale: 1.12, duration: 0.9, yoyo: true, repeat: 1, ease: "sine.inOut" },
        flareTime
      );
      timeline.fromTo(["#bg-flare-1", "#bg-flare-2", "#bg-flare-3"],
        { scale: 0.9, opacity: 0.35 },
        { scale: 1.35, opacity: 0.8, duration: 1.1, stagger: 0.15, yoyo: true, repeat: 1, ease: "sine.inOut" },
        flareTime
      );
    }

    // Continuous Rising Burning Embers across 268s
    gsap.utils.toArray(".ambient-ember").forEach((ember, idx) => {
      tl.to(ember, {
        y: -360 - (idx % 5) * 110,
        x: (idx % 2 === 0 ? 1 : -1) * (70 + (idx % 4) * 35),
        duration: 268,
        ease: "none"
      }, 0);
    });

    // Progress Bar Fill
    tl.fromTo("#progressFillPath", { strokeDashoffset: 1760 }, { strokeDashoffset: 0, duration: 268, ease: "none" }, 0);

    let timeOffset = 0;

    PRESIDENTS.forEach((p, i) => {
      const node = `#node-${i}`;
      const border = `#border-path-${i}`;
      const bgLandmark = `#bg-landmark-${i}`;
      const cutout = `#cutout-${i}`;
      const details = `#card-details-${i}`;

      const parts1 = `#icon-1-${i} .svg-part`;
      const head1 = `#head-1-${i}`;
      const sub1 = `#sub-1-${i}`;

      const parts2 = `#icon-2-${i} .svg-part`;
      const head2 = `#head-2-${i}`;
      const sub2 = `#sub-2-${i}`;

      const stamp = `#stamp-${i}`;
      const t = timeOffset;
      const dur = p.duration;

      // Shift Atmospheric Mood & Schedule Burning Flare
      tl.to("#mood-backdrop", { background: p.moodBg, duration: 1.5, ease: "sine.inOut" }, t);
      if (typeof p.flareTime === "number") {
        scheduleBurningFlare(tl, t + p.flareTime);
      }

      if (i === 0) {
        tl.set("#canvas-world", { x: -p.x, y: -p.y }, 0);
        tl.set(node, { scale: 1, opacity: 1, z: 45 }, 0);
        tl.set("#counterIndicator", { textContent: "01 / 15" }, 0);
        tl.fromTo(`${node} .year-behind-head`, { y: -30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, 0.2);
        tl.fromTo(bgLandmark, { scale: 0.92, opacity: 0, z: -10 }, { scale: 1, opacity: p.bgMeta.opacity, z: 10, duration: 0.7 }, 0.4);
        tl.fromTo(cutout, { y: 45, scale: 0.92, opacity: 0, z: 40 }, { y: 0, scale: 1, opacity: 1, z: 85, duration: 0.75, ease: "back.out(1.4)" }, 0.7);
        tl.fromTo(details, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, 1.0);
        tl.fromTo(border, { strokeDashoffset: 2460 }, { strokeDashoffset: 0, duration: dur, ease: "linear" }, 0);
      } else {
        const transStart = Math.max(0, t - 0.7);
        const prevNode = `#node-${i - 1}`;
        const arrow = `#arrow-${i}`;
        tl.to(prevNode, { scale: 0.75, opacity: 0.08, filter: "blur(14px)", duration: 0.9, ease: "power2.inOut" }, transStart);
        tl.to("#canvas-world", { x: -p.x, y: -p.y, duration: 1.1, ease: "power3.inOut" }, transStart);
        tl.fromTo(arrow, { strokeDashoffset: 1800, opacity: 1 }, { strokeDashoffset: 0, opacity: 1, duration: 1.0, ease: "power2.out" }, transStart + 0.1);
        tl.fromTo(node, { scale: 0.85, opacity: 0.12, filter: "blur(12px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", z: 45, duration: 0.9, ease: "power2.out" }, transStart + 0.3);
        tl.to(arrow, { opacity: 0.12, duration: 0.8 }, t + 0.8);
        tl.fromTo(border, { strokeDashoffset: 2460 }, { strokeDashoffset: 0, duration: dur, ease: "linear" }, t);
        tl.fromTo(`${node} .year-behind-head`, { y: -25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, t + 0.2);
        tl.fromTo(bgLandmark, { scale: 0.92, opacity: 0, z: -10 }, { scale: 1, opacity: p.bgMeta.opacity, z: 10, duration: 0.7 }, t + 0.35);
        tl.fromTo(cutout, { y: 40, scale: 0.92, opacity: 0, z: 40 }, { y: 0, scale: 1, opacity: 1, z: 85, duration: 0.75, ease: "back.out(1.4)" }, t + 0.65);
        tl.fromTo(details, { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.5 }, t + 0.95);
        tl.set("#counterIndicator", { textContent: `${String(i + 1).padStart(2, '0')} / 15` }, transStart + 0.6);
      }

      // ==============================================================
      // ELEMENT 1: ONE-BY-ONE STAGGERED CANVAS DRAWING (~3.0s)
      // Each SVG part draws sequentially one after another, then Text!
      // ==============================================================
      const e1Start = t + p.e1.time;
      tl.fromTo(parts1,
        { opacity: 0, scale: 0.75, strokeDasharray: 500, strokeDashoffset: 500 },
        { opacity: 1, scale: 1, strokeDashoffset: 0, duration: 0.55, stagger: 0.18, ease: "back.out(1.6)" },
        e1Start
      );
      tl.fromTo(head1,
        { opacity: 0, y: 22, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        e1Start + 0.75
      );
      tl.fromTo(sub1,
        { opacity: 0, x: -16 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        e1Start + 1.05
      );

      // ==============================================================
      // ELEMENT 2: ONE-BY-ONE STAGGERED CANVAS DRAWING (~9.0s)
      // ==============================================================
      const e2Start = t + p.e2.time;
      tl.fromTo(parts2,
        { opacity: 0, scale: 0.75, strokeDasharray: 500, strokeDashoffset: 500 },
        { opacity: 1, scale: 1, strokeDashoffset: 0, duration: 0.55, stagger: 0.18, ease: "back.out(1.6)" },
        e2Start
      );
      tl.fromTo(head2,
        { opacity: 0, y: 22, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" },
        e2Start + 0.85
      );
      tl.fromTo(sub2,
        { opacity: 0, x: 16 },
        { opacity: 1, x: 0, duration: 0.45, ease: "power2.out" },
        e2Start + 1.15
      );

      // ==============================================================
      // 3RD ELEMENT: STAMP SLAM
      // ==============================================================
      const stampStart = t + p.stamp.time;
      tl.fromTo(stamp,
        { scale: 2.2, opacity: 0, rotate: -12 },
        { scale: 1, opacity: 1, rotate: -2.5, duration: 0.55, ease: "back.out(2.5)" },
        stampStart
      );

      // 2.5D Optical Parallax on Center Portrait
      tl.to(bgLandmark, { x: -20, y: 12, scale: 1.05, duration: dur - 1.2, ease: "sine.inOut" }, t + 0.8);
      tl.to(cutout, { x: 24, y: -16, duration: dur - 1.2, ease: "sine.inOut" }, t + 0.8);

      timeOffset += dur;
    });
  </script>
</body>
</html>
