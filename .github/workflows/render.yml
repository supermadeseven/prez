name: Render HyperFrames Video

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-color-emoji fontconfig

      - name: Install Project Dependencies
        run: npm install

      - name: Install Headless Browser Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run HyperFrames Lint
        run: npx hyperframes lint

      - name: Render HyperFrames Composition to MP4
        run: |
          mkdir -p output
          npx hyperframes render index.html -o output/presidents_timeline.mp4

      - name: Upload Final Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: presidents-timeline-final
          path: output/presidents_timeline.mp4
          retention-days: 14
